{% extends "base.html" %}{% block title %}注册 — 途行旅行社{% endblock %}{% block content %}
<div class="flex items-center justify-center" style="min-height:70vh">
  <div style="width:100%;max-width:440px">

    <!-- Header -->
    <div style="text-align:center;margin-bottom:28px">
      <div class="w-16 h-16 flex items-center justify-center rounded-md mx-auto mb-16" style="background:linear-gradient(135deg, #007aff, #5856d6);box-shadow:0 1px 4px rgba(0,0,0,0.08)">
        <i class="fa-solid fa-horse-head text-white" style="font-size:22px"></i>
      </div>
      <h2 class="text-2xl font-bold tracking-tight mb-6">创建新账户</h2>
      <p style="color:#86868b;font-size:15px">加入途行旅行社，开启美好旅程</p>
    </div>

    <!-- Form card -->
    <div class="card-frosted" style="padding:24px 28px">
      <form method="POST" style="display:flex;flex-direction:column;gap:18px">
        <div>
          <label class="text-sm font-medium mb-2 block">用户名</label>
          <input type="text" name="username" class="input-apple" placeholder="设置登录用户名" required>
        </div>
        <div>
          <label class="text-sm font-medium mb-2 block">密码</label>
          <input type="password" name="password" class="input-apple" placeholder="设置密码" required>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:18px">
          <div>
            <label class="text-sm font-medium mb-2 block">姓名</label>
            <input type="text" name="name" class="input-apple" placeholder="真实姓名" required>
          </div>
          <div>
            <label class="text-sm font-medium mb-2 block">电话</label>
            <input type="text" name="phone" class="input-apple" placeholder="联系电话">
          </div>
        </div>
        <div>
          <label class="text-sm font-medium mb-2 block">邮箱 <span style="color:#aeaeb2;font-weight:400">(选填)</span></label>
          <input type="email" name="email" class="input-apple" placeholder="电子邮箱">
        </div>
        <button type="submit" class="btn-primary w-full">创建账户</button>
        <p style="color:#86868b;font-size:14px;text-align:center">
          已有账户？<a href="{{ url_for('auth.login') }}" style="color:#007aff;text-decoration:none;font-weight:500">立即登录</a>
        </p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
