{% extends "base.html" %}{% block title %}登录 - 途行旅行社{% endblock %}{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
  <div class="w-full flex flex-col gap-24" style="max-width:400px">
    <div class="flex flex-col items-center gap-8">
      <div class="w-12 h-12 flex items-center justify-center rounded-xl" style="background:#2563eb">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <h2 class="text-xl font-semibold">途行旅行社</h2>
      <p class="text-sm text-muted">旅游业务管理系统</p>
    </div>

    <div class="card p-24">
      <!-- Tab -->
      <div class="flex mb-24 p-4 rounded-lg" style="background:rgb(var(--muted))">
        <button onclick="switchTab('customer')" id="tab-customer" class="flex-1 h-8 flex items-center justify-center text-sm font-medium rounded-lg transition-base" style="background:rgb(var(--card));color:rgb(var(--fg));box-shadow:0 1px 2px rgba(0,0,0,0.04)">客户登录</button>
        <button onclick="switchTab('staff')" id="tab-staff" class="flex-1 h-8 flex items-center justify-center text-sm font-medium rounded-lg transition-base" style="color:rgb(var(--muted-fg))">管理者登录</button>
      </div>

      <form method="POST" id="form-customer" class="flex flex-col gap-16">
        <input type="hidden" name="role" value="customer">
        <div class="flex flex-col gap-4"><label class="text-sm font-medium">用户名</label><input type="text" name="username" class="input" placeholder="请输入用户名" required></div>
        <div class="flex flex-col gap-4"><label class="text-sm font-medium">密码</label><input type="password" name="password" class="input" placeholder="请输入密码" required></div>
        <button type="submit" class="btn-primary w-full">登录</button>
        <p class="text-sm text-center text-muted">没有账户？<a href="{{ url_for('auth.register') }}" style="color:#2563eb;text-decoration:none" class="hover:underline">立即注册</a></p>
      </form>

      <form method="POST" id="form-staff" class="flex flex-col gap-16 hidden">
        <input type="hidden" name="role" value="staff">
        <div class="flex flex-col gap-4"><label class="text-sm font-medium">员工用户名</label><input type="text" name="username" class="input" placeholder="请输入员工用户名" required></div>
        <div class="flex flex-col gap-4"><label class="text-sm font-medium">密码</label><input type="password" name="password" class="input" placeholder="请输入密码" required></div>
        <button type="submit" class="btn-primary w-full">管理者登录</button>
      </form>
    </div>
  </div>
</div>
<script>
function switchTab(t){
  var cust=document.getElementById('tab-customer'),staff=document.getElementById('tab-staff');
  var fc=document.getElementById('form-customer'),fs=document.getElementById('form-staff');
  if(t==='customer'){
    cust.style.background='rgb(var(--card))';cust.style.color='rgb(var(--fg))';cust.style.boxShadow='0 1px 2px rgba(0,0,0,0.04)';
    staff.style.background='transparent';staff.style.color='rgb(var(--muted-fg))';staff.style.boxShadow='none';
    fc.classList.remove('hidden');fs.classList.add('hidden');
  }else{
    staff.style.background='rgb(var(--card))';staff.style.color='rgb(var(--fg))';staff.style.boxShadow='0 1px 2px rgba(0,0,0,0.04)';
    cust.style.background='transparent';cust.style.color='rgb(var(--muted-fg))';cust.style.boxShadow='none';
    fs.classList.remove('hidden');fc.classList.add('hidden');
  }
}
</script>
{% endblock %}
